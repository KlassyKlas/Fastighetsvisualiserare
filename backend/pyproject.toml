[project]
name = "fastighetsvisualiserare-backend"
version = "1.0.0"
description = "API för visualisering av svenska fastigheter och infrastrukturprojekt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # <2.1: SQLAlchemy 2.1 ligger i beta (sommaren 2026) — släpp in den medvetet
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "asyncpg>=0.29",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "alembic>=1.13",
    "pyproj>=3.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "openpyxl>=3.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Kodbasens kommentarer och docstrings är på svenska — reglerna om
# "tvetydiga" unicode-tecken (×, –, …) ger bara falsklarm här.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: kräver en riktig PostGIS-databas via DATABASE_URL",
]
