# Standard (utveckling): bara databasen — backend och frontend körs
# lokalt med uv respektive npm.
#
#   docker compose up -d
#
# Hela stacken i containrar:
#
#   docker compose --profile full up --build
#
# OBS: postgis-imagen är uppgraderad från 16-3.4 till 17-3.5 —
# en gammal pgdata-volym är inkompatibel. Kör `docker compose down -v`
# en gång och seeda om.

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: fastighetsvisualiserare-db
    environment:
      POSTGRES_DB: fastighetsvisualiserare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ['full']
    build: ./backend
    container_name: fastighetsvisualiserare-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/fastighetsvisualiserare
      TRAFIKVERKET_API_KEY: ${TRAFIKVERKET_API_KEY:-}
      CORS_ORIGINS: '["http://localhost:8080"]'
    # Migrera och seeda (idempotent upsert) innan servern startar
    command: >
      sh -c "uv run --no-sync alembic upgrade head &&
             uv run --no-sync python -m scripts.seed &&
             uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ['full']
    build:
      context: ./frontend
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: fastighetsvisualiserare-frontend
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  pgdata:
